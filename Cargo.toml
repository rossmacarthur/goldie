[package]
name = "goldie"
version = "0.5.0"
authors = ["Ross MacArthur <ross@macarthur.io>"]
edition = "2021"
rust-version = "1.80"
description = "Simple golden file testing"
readme = "README.md"
repository = "https://github.com/rossmacarthur/goldie"
license = "MIT OR Apache-2.0"
keywords = ["golden", "file", "testing", "tool"]
categories = ["development-tools::testing"]
include = ["src/lib.rs", "LICENSE-*", "README.md"]

[dependencies]
pretty_assertions = { version = "1.4.1", optional = true }
serde = { version = "1.0.136", features = ["derive"], optional = true }
serde_json = { version = "1.0.79", optional = true }
upon = { version = "0.10.0", features = ["syntax"], optional = true }
yansi = { version = "1.0.1", optional = true }

[dev-dependencies]
anyhow = "1.0.55"

[features]
default = ["color", "json", "template"]

# Enables color output in assertions and diffs
color = ["dep:pretty_assertions", "dep:yansi"]

# Enables assert_json!
json = ["dep:serde", "dep:serde_json"]

# Enables assert_template!
template = ["dep:serde", "dep:upon"]
